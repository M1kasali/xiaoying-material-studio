name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -f backend/pom.xml verify
  compose:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - name: Verify database-backed catalog through Next.js
        shell: bash
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:3000/ -o /dev/null
          curl --fail http://localhost:3000/api/templates -o /tmp/templates.json
          python -c "import json; data=json.load(open('/tmp/templates.json')); assert len(data)==6; assert {t['requiredImageCount'] for t in data}=={1,2,3}"
          curl --fail http://localhost:3000/templates/coastal-postcard -o /dev/null
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://localhost:8080/api/templates/does-not-exist)" = 404
      - name: Verify sessions, uploads, asynchronous tasks and restart handling
        run: python scripts/backend_smoke.py --restart
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
