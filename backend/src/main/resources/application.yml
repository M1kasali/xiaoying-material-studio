spring:
  application:
    name: material-studio
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/material_studio?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:studio}
    password: ${DB_PASSWORD:studio_local_password}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 16MB
  mvc:
    problemdetails:
      enabled: true
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
studio:
  storage-root: ${STORAGE_ROOT:./data}
