spring:
  application:
    name: material-studio
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/material_studio?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:studio}
    password: ${DB_PASSWORD:studio_local_password}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 16MB
  mvc:
    problemdetails:
      enabled: true
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
studio:
  storage-root: ${STORAGE_ROOT:./data}
  demo-enabled: ${DEMO_ENABLED:true}
  secure-cookie: ${SECURE_COOKIE:false}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080}
  worker-count: ${TASK_WORKERS:2}
  queue-capacity: ${TASK_QUEUE_CAPACITY:32}
  default-delay-ms: ${SIMULATION_DELAY_MS:2000}
